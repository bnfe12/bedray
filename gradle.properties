org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Minecraft and NeoForge
minecraft_version=26.3.0
neoforge_version=26.3.0.1

# Mod
mod_id=bedray
mod_name=Bedray
mod_version=0.1.1-alpha.10
mod_group=io.github.andrexarlay
mod_description=ALPHA. Bedrock RTX-style ray and path tracing for Minecraft Java on the native Vulkan backend, with DLSS, XeSS and FSR upscalers and a denoiser. Unofficial, not affiliated with Mojang, Microsoft, NVIDIA, AMD or Intel.
artifact_base=bedray


# LWJGL and Mixin
lwjgl_version=3.3.3
lwjgl_sdl_version=3.4.1
mixin_version=0.8.5
slf4j_version=2.0.12

# Launcher library versions the loader modules compile against (compileOnly; jars are taken from your launcher's libraries folder)
neoforge_runtime_version=26.3.0.57-beta
fml_loader_version=12.0.9
nf_bus_version=8.0.5
nf_mergetool_version=2.0.7
lwjgl_natives_version=3.4.3

# Fabric
fabric_minecraft_range=26.3
fabric_loader_version=0.19.5

# Machine-specific folders are NOT set here. See gradle.properties.example and docs/BUILDING.md.
