apply from: rootProject.file('gradle/loader-module.gradle')
apply from: rootProject.file('gradle/slang.gradle')

// All mod logic lives here (no loader API: see NoLoaderImportsTest). The loader modules only add entry points and descriptors.
base {
    archivesName = "${rootProject.artifact_base}-common"
}

java {
    withSourcesJar()
}

dependencies {
    compileOnly project(':renderer-api')
    testImplementation project(':renderer-api')
    // Bedray Core (internal platform layer, vendored in this repository): device-requirement registry, native-library resolver, autotest harness.
    compileOnly project(':core')
    testImplementation project(':core')

    testImplementation fileTree(dir: rootProject.file('libs'), include: ['*.jar'])
    testImplementation "org.lwjgl:lwjgl:${rootProject.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-opengl:${rootProject.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-vulkan:${rootProject.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-shaderc:${rootProject.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-spvc:${rootProject.lwjgl_version}"
    testRuntimeOnly "org.lwjgl:lwjgl:${rootProject.lwjgl_version}:natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl-opengl:${rootProject.lwjgl_version}:natives-windows"

    testImplementation "org.spongepowered:mixin:${rootProject.mixin_version}"
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'

    testImplementation 'org.joml:joml:1.10.8'
    testImplementation 'com.mojang:brigadier:1.3.10'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.apache.commons:commons-lang3:3.17.0'
    testImplementation 'io.netty:netty-codec:4.2.16.Final'
    testImplementation 'io.netty:netty-common:4.2.16.Final'
    testImplementation 'io.netty:netty-buffer:4.2.16.Final'
    testImplementation 'it.unimi.dsi:fastutil:8.5.15'
    testImplementation 'com.google.guava:guava:33.3.1-jre'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    testImplementation 'org.apache.maven:maven-artifact:3.9.9'

    testImplementation "org.slf4j:slf4j-api:${rootProject.slf4j_version}"
    testImplementation "org.slf4j:slf4j-simple:${rootProject.slf4j_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// JUnit: structural tests (no loader imports in common). The Java-level suite is ShimTestRunner (runShimTests).
test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}

tasks.register('runShimTests', JavaExec) {
    group = 'verification'
    description = 'Executes the Vulkan RTX Java-level test suite (no GPU, not in-game evidence)'
    dependsOn tasks.named('testClasses')
    // shaderc natives (shaderc.dll) are not on the Maven test classpath; take them from the launcher libraries.
    def shadercNative = file("${rootProject.lwjgl_libs_dir}/lwjgl-shaderc-natives-windows/${rootProject.lwjgl_natives_version}/lwjgl-shaderc-natives-windows-${rootProject.lwjgl_natives_version}.jar")
    doFirst {
        if (!shadercNative.isFile()) {
            throw new GradleException("LWJGL shaderc natives jar not found (set BEDRAY_LAUNCHER_LIBRARIES or lwjgl_libs_dir, see docs/BUILDING.md): " + shadercNative)
        }
    }
    classpath = sourceSets.test.runtimeClasspath + files(shadercNative)
    mainClass = 'io.github.andrexarlay.vulkancompat.ShimTestRunner'
    jvmArgs = [
        '--enable-native-access=ALL-UNNAMED'
    ]
    systemProperties System.properties
}

tasks.named('check') {
    dependsOn tasks.named('runShimTests')
}

// ---- Tier 1 Slang toolchain (host RT). Mirrors compute-common's Tier 0 path; SPIR-V 1.4 direct. ----
def slangShaderOut = layout.buildDirectory.dir('generated/shaders')
def slangRtVariants = [
    [name: 'rt_tier1_probe', src: 'rt_tier1_probe', defines: []],
    [name: 'fg_prepare', src: 'fg_prepare', defines: []],
    [name: 'iris_depth', src: 'iris_depth', defines: []],
    [name: 'rt_particles_composite', src: 'rt_particles_composite', defines: []],
    [name: 'rt_composite', src: 'rt_composite', defines: []],
]
def slangRtBaseArgs = ['-target', 'spirv', '-profile', 'spirv_1_4', '-emit-spirv-directly', '-entry', 'main']
tasks.register('compileSlangShaders') {
    dependsOn tasks.named('fetchSlang')
    inputs.dir('src/main/resources/shaders/slang')
    // Fingerprint the compiler binary, flags and variant defines so a flag change recompiles
    // instead of silently reusing a stale .spv (the cache key must cover every compiler input).
    inputs.file(slangc)
    inputs.property('slangRtVariants', slangRtVariants)
    inputs.property('slangRtBaseArgs', slangRtBaseArgs)
    outputs.dir(slangShaderOut)
    doLast {
        def outDir = new File(slangShaderOut.get().asFile, 'assets/bedray_rt/shaders')
        outDir.mkdirs()
        slangRtVariants.each { v ->
            def src = file("src/main/resources/shaders/slang/${v.src}.slang").absolutePath
            def args = [slangc.absolutePath, src] + slangRtBaseArgs
            v.defines.each { d -> args << "-D${d}".toString() }
            args << '-o' << new File(outDir, "${v.name}_v14.spv").absolutePath
            def proc = new ProcessBuilder(args).redirectErrorStream(true).start()
            def log = proc.inputStream.text
            if (proc.waitFor() != 0) throw new GradleException("slangc failed (${v.name}):\n${log}")
        }
    }
}
sourceSets.main.resources.srcDir(slangShaderOut)
tasks.named('processResources') { dependsOn tasks.named('compileSlangShaders') }

// Offscreen RT measurement harness (L2). shaderc natives are not on the Maven test classpath;
// take them from the launcher libraries exactly as runShimTests does.
def shadercNative = file("${rootProject.lwjgl_libs_dir}/lwjgl-shaderc-natives-windows/${rootProject.lwjgl_natives_version}/lwjgl-shaderc-natives-windows-${rootProject.lwjgl_natives_version}.jar")
tasks.register('rtProbe', Test) {
    group = 'verification'
    description = 'Offscreen Vulkan 1.2 ray-query dispatch + readback (L2, not in-game). Fails if no RT device.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(shadercNative)
    useJUnitPlatform()
    filter { includeTestsMatching '*RtBaselineProbeTest' }
    systemProperty 'bedray.rt.rtProbe', 'true'
    // LWJGL 3.3.x enumerates driver extensions on its native stack; current drivers exceed 64 KiB.
    systemProperty 'org.lwjgl.system.stackSize', '256'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        if (!shadercNative.isFile()) {
            throw new GradleException("LWJGL shaderc natives jar not found (set BEDRAY_LAUNCHER_LIBRARIES or lwjgl_libs_dir, see docs/BUILDING.md): " + shadercNative)
        }
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', new File(temporaryDir, 'lwjgl-natives').absolutePath
    }
    testLogging { events 'passed', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}

tasks.register('rtBaseline', JavaExec) {
    group = 'verification'
    description = 'V0 RT baseline: three fixed offscreen ray-query scenes -> docs/RT_BASELINE.md (L2, not in-game)'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + files(shadercNative)
    mainClass = 'io.github.andrexarlay.vulkancompat.rt.harness.RtBaselineRunner'
    workingDir = rootProject.projectDir
    args rootProject.projectDir.absolutePath
    systemProperty 'org.lwjgl.system.stackSize', '256'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        if (!shadercNative.isFile()) {
            throw new GradleException("LWJGL shaderc natives jar not found (set BEDRAY_LAUNCHER_LIBRARIES or lwjgl_libs_dir, see docs/BUILDING.md): " + shadercNative)
        }
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', new File(temporaryDir, 'lwjgl-natives').absolutePath
    }
}

tasks.register('postProbe', Test) {
    group = 'verification'
    description = 'Offscreen plain-compute post-shader harness + A/B (L2, not in-game). Fails if no compute device.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(shadercNative)
    useJUnitPlatform()
    workingDir = rootProject.projectDir
    filter { includeTestsMatching '*PostShaderProbeTest'; includeTestsMatching '*FgPrepareAbTest'; includeTestsMatching '*IrisDepthAbTest'; includeTestsMatching '*ParticlesAbTest'; includeTestsMatching '*CompositeAbTest' }
    systemProperty 'bedray.rt.postProbe', 'true'
    systemProperty 'org.lwjgl.system.stackSize', '256'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        if (!shadercNative.isFile()) {
            throw new GradleException("LWJGL shaderc natives jar not found (set BEDRAY_LAUNCHER_LIBRARIES or lwjgl_libs_dir, see docs/BUILDING.md): " + shadercNative)
        }
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', new File(temporaryDir, 'lwjgl-natives').absolutePath
    }
    testLogging { events 'passed', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}

tasks.register('postBaseline', JavaExec) {
    group = 'verification'
    description = 'Plain compute post-shader GLSL baseline -> docs/POST_BASELINE.md (L2, not in-game)'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + files(shadercNative)
    mainClass = 'io.github.andrexarlay.vulkancompat.rt.harness.PostBaselineRunner'
    workingDir = rootProject.projectDir
    args rootProject.projectDir.absolutePath
    systemProperty 'org.lwjgl.system.stackSize', '256'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        if (!shadercNative.isFile()) {
            throw new GradleException("LWJGL shaderc natives jar not found (set BEDRAY_LAUNCHER_LIBRARIES or lwjgl_libs_dir, see docs/BUILDING.md): " + shadercNative)
        }
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', new File(temporaryDir, 'lwjgl-natives').absolutePath
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = "${rootProject.artifact_base}-common"
        }
    }
}
