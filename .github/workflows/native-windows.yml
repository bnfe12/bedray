name: Native Windows contracts

on:
  workflow_dispatch:
    inputs:
      dlss_neural_rendering:
        description: Compile and probe the optional NVIDIA DLSS Neural Rendering ABI
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/native-ci-abi-exceptions, 'codex/migration-*']

permissions:
  contents: read

jobs:
  vendor-resources:
    name: DLSS resource contracts (no GPU)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout pinned Vulkan-Headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 2cd90f9d20df57eac214c148f3aed885372ddcfe
          path: deps/Vulkan-Headers
          persist-credentials: false
      - name: Build production wrappers and exercise actual entrypoints with SDK failures
        shell: pwsh
        env:
          PROBE_DLSS_NR: ${{ inputs.dlss_neural_rendering }}
        run: |
          ./source/.github/scripts/vendor-resources-ci.ps1 -SourceRoot source -Headers deps/Vulkan-Headers/include -BuildRoot evidence/vendor -DependencyRoot deps/vendor -ProbeDlssNeuralRendering:($env:PROBE_DLSS_NR -eq 'true')
      - name: Install JDK for actual host FFM probes
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Exercise actual Java bindings against fault and production DLLs
        shell: pwsh
        env:
          PROBE_DLSS_NR: ${{ inputs.dlss_neural_rendering }}
        run: |
          $partner = if ($env:PROBE_DLSS_NR -eq 'true') { 'evidence/vendor/partner/Release/vkb_dlss_nr_contract.dll' } else { '' }
          ./source/.github/scripts/dlss-ffm-ci.ps1 -SourceRoot source -RuntimeRoot evidence/vendor/runtime -DependencyRoot deps/java -EvidenceRoot evidence/vendor/ffm -PartnerWrapper $partner
      - name: Publish resource test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlss-resource-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/vendor/**/*.log
            evidence/vendor/**/*.xml
            evidence/vendor/**/CMakeConfigureLog.yaml
      - name: Publish tested wrappers and CPU fault fixtures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlss-wrappers-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: evidence/vendor/runtime/*
  native:
    name: Native ${{ matrix.revision }} (no GPU)
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    env:
      VULKAN_HEADERS_SHA: 2cd90f9d20df57eac214c148f3aed885372ddcfe # v1.4.321
      SLANG_VERSION: '2026.20'
      SLANG_SHA256: e6dd32bbddf1720ebb4e679d55e9635ce792865a5bd84f3d2cd9af28647c0174
      NRD_HEADERS_SHA: 8f12a22fc90e6a3c7f5da4c9c3103633c842963a # v4.18.0, headers only; runtime is not downloaded
    steps:
      - name: Checkout CI driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: driver
          persist-credentials: false
      - name: Checkout source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.revision == 'baseline' && '4236c75ab72fded1347dd19d88f38a3804742a38' || github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout pinned Vulkan-Headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_SHA }}
          path: deps/Vulkan-Headers
          persist-credentials: false
      - name: Fetch and verify pinned Slang SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'slang.zip'
          $url = "https://github.com/shader-slang/slang/releases/download/v${env:SLANG_VERSION}/slang-${env:SLANG_VERSION}-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SLANG_SHA256) { throw "Slang SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $archive -DestinationPath deps/slang
          "Slang $env:SLANG_VERSION sha256=$hash; Vulkan-Headers $env:VULKAN_HEADERS_SHA" | Tee-Object evidence/dependencies.txt
          & ./deps/slang/bin/slangc.exe -version 2>&1 | Tee-Object evidence/slang-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'slangc version probe failed' }
      - name: Checkout pinned NRD headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA-RTX/NRD
          ref: ${{ env.NRD_HEADERS_SHA }}
          path: deps/NRD
          persist-credentials: false
      - name: Configure, build and test native modules
        shell: pwsh
        run: |
          ./driver/.github/scripts/native-ci.ps1 -SourceRoot source -Headers deps/Vulkan-Headers/include -BuildRoot evidence/build -Slangc deps/slang/bin/slangc.exe -NrdHeaders deps/NRD/Include
      - name: Publish text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.revision }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/**/*.txt
            evidence/**/*.log
            evidence/**/*.xml
            evidence/**/CMakeConfigureLog.yaml
      - name: Prepare tested renderer core
        if: success() && matrix.revision == 'candidate'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Resolve-Path 'evidence/build/bedray_core/Release/bedray_core.dll'
          New-Item -ItemType Directory -Force evidence/runtime | Out-Null
          Copy-Item -LiteralPath $binary -Destination 'evidence/runtime/bedray_core.dll'
          [ordered]@{
            schema = 1
            revision = '${{ github.sha }}'
            artifact = 'bedray_core.dll'
            platform = 'windows-x64-release'
            abi_version = 2
            sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            native_contracts = 'passed'
            gpu_validated = $false
          } | ConvertTo-Json | Set-Content -LiteralPath 'evidence/runtime/manifest.json' -Encoding utf8NoBOM
      - name: Publish tested renderer core
        if: success() && matrix.revision == 'candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-core-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: evidence/runtime/*
