name: GPU test report
description: Share a compatibility result from your hardware
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        Results from AMD Radeon and Intel Arc are especially helpful. Failed starts are useful reports too.
        The [testing guide](https://github.com/bnfe12/bedray/blob/main/docs/TESTING.md) explains what to check.
        Review logs and screenshots for personal information before sharing them.
  - type: input
    id: hardware
    attributes:
      label: GPU, VRAM, driver and operating system
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Bedray build, Minecraft, loader and Sodium versions
      description: Include a release tag or source commit, and say whether you use NeoForge or Fabric.
    validations:
      required: true
  - type: dropdown
    id: starts
    attributes:
      label: Does the game start with Vulkan and show Bedray settings?
      options: ["Yes", "No", "Not tested"]
    validations:
      required: true
  - type: dropdown
    id: tracing
    attributes:
      label: Path tracing result
      options: ["Renders a scene", "Option unavailable", "Crash or error", "Not tested"]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What did you test?
      description: Describe the scene, image settings and any optional upscaler or denoiser you tried. Say which native libraries were installed.
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Performance, if measured
      description: Include resolution, render scale, render distance and FPS. Separate rendered FPS from generated frames.
  - type: textarea
    id: evidence
    attributes:
      label: Diagnostics and screenshots
      description: Attach a reviewed Bedray report, relevant log lines or screenshots. Remove personal paths, names and server addresses first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I reviewed my attachments and removed personal information.
          required: true
