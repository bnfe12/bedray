name: Bug report
description: Report a crash, rendering problem or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bedray is an early alpha. Check the [known issues](https://github.com/bnfe12/bedray/blob/main/docs/KNOWN_ISSUES.md) first.
        Review every attachment for personal paths, account names, server addresses and credentials.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the scene or action that triggers the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bedray build
      description: Release tag or commit, and JAR version. Say if this is a source build.
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [NeoForge, Fabric]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, loader and Sodium versions
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, VRAM, driver and operating system
    validations:
      required: true
  - type: input
    id: rendering
    attributes:
      label: Renderer and image settings
      description: Mode, resolution, upscaler, denoiser and frame generation, if known.
  - type: textarea
    id: report
    attributes:
      label: Diagnostics or relevant log excerpt
      description: Attach a reviewed Bedray report or crash log. A report is optional if the game cannot start. See PRIVACY.md before sharing.
      render: text
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or extra context
      description: For visual issues, include the settings and whether the image was captured while moving or standing still.
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I reviewed my attachments and removed personal information.
          required: true
        - label: I also reproduced this in a separate instance with only Sodium and Bedray.
