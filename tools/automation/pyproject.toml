[project]
name = "bedray-capture-analysis"
version = "0.2.0"
description = "Offline acceptance of Bedray raw native-resolution frame captures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bedray-bench = "run_bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["run_bench.py", "capture_analysis.py"]
