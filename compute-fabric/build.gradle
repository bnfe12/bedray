apply from: rootProject.file('gradle/loader-module.gradle')
evaluationDependsOn(':compute-common')
base { archivesName = 'bedray-compute-fabric-mc26.3' }
dependencies {
    compileOnly project(':renderer-api')
    compileOnly project(':compute-common')
    compileOnly files("${rootProject.fabric_libs_dir}/fabric-loader/${rootProject.fabric_loader_version}/fabric-loader-${rootProject.fabric_loader_version}.jar")
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
jar {
    from project(':compute-common').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    from(rootProject.file('COPYING'))
    apply from: rootProject.file('gradle/build-provenance.gradle')
}
