profile.NEUTRAL = !ENABLE_COLOR_CONTRAST !ENABLE_COLOR_EXPOSURE COLOR_CONTRAST=1.0 COLOR_EXPOSURE=1.0 !program.composite
profile.NORMAL = ENABLE_COLOR_CONTRAST !ENABLE_COLOR_EXPOSURE COLOR_CONTRAST=1.05 COLOR_EXPOSURE=1.0
profile.BRIGHT = profile.NORMAL ENABLE_COLOR_EXPOSURE COLOR_EXPOSURE=1.05

program.composite.enabled = defined(ENABLE_COLOR_EXPOSURE)

#ifdef ENABLE_COLOR_EXPOSURE
screen = <profile> ENABLE_COLOR_CONTRAST COLOR_CONTRAST ENABLE_COLOR_EXPOSURE COLOR_EXPOSURE
#else
screen = <profile> ENABLE_COLOR_CONTRAST COLOR_CONTRAST ENABLE_COLOR_EXPOSURE
#endif
sliders = COLOR_CONTRAST COLOR_EXPOSURE
