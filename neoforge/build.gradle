apply from: rootProject.file('gradle/loader-module.gradle')
// Git-Commit / Git-Dirty / Build-Source on the jar and combinedJar manifests (project level: configureEach
// must not run inside a task configuration block).
apply from: rootProject.file('gradle/build-provenance.gradle')

base {
    archivesName = "${rootProject.artifact_base}-neoforge-mc${rootProject.minecraft_version}"
}

dependencies {
    compileOnly project(':common')
    compileOnly project(':core')

    // NeoForge classes (@Mod, event bus) from the launcher's own libraries. compileOnly: never packaged.
    def nfLibs = [
        "${rootProject.neoforge_libs_dir}/neoforge/${rootProject.neoforge_runtime_version}/neoforge-${rootProject.neoforge_runtime_version}-universal.jar",
        "${rootProject.neoforge_libs_dir}/fancymodloader/loader/${rootProject.fml_loader_version}/loader-${rootProject.fml_loader_version}.jar",
        "${rootProject.neoforge_libs_dir}/bus/${rootProject.nf_bus_version}/bus-${rootProject.nf_bus_version}.jar",
        "${rootProject.neoforge_libs_dir}/mergetool/${rootProject.nf_mergetool_version}/mergetool-${rootProject.nf_mergetool_version}-api.jar"
    ]
    def missingNfLibs = nfLibs.findAll { !file(it).isFile() }
    if (!missingNfLibs.isEmpty()) {
        throw new GradleException("NeoForge launcher jars not found (set BEDRAY_LAUNCHER_LIBRARIES or neoforge_libs_dir, see docs/BUILDING.md): " + missingNfLibs.join(", "))
    }
    compileOnly files(nfLibs)
    compileOnly 'com.mojang:brigadier:1.3.10'   // client command registration (RegisterClientCommandsEvent)
}

// Mod id of the older separate build of the platform layer, declared incompatible (two copies of one code must never load).
def oldCoreModId = 'vulkan_' + 'bridge'

processResources {
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_version', rootProject.mod_version
    inputs.property 'mod_description', rootProject.mod_description
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'old_core_mod_id', oldCoreModId

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_version': rootProject.mod_version,
            'mod_description': rootProject.mod_description,
            'minecraft_version': rootProject.minecraft_version,
            'neoforge_version': rootProject.neoforge_version,
            'old_core_mod_id': oldCoreModId,
        )
    }
}

// Shared manifest for the standalone and the combined jar (build-provenance.gradle adds Git-Commit / Git-Dirty / Build-Source).
def modManifestAttributes = [
    'Specification-Title'     : rootProject.mod_name,
    'Specification-Vendor'    : 'bnfe12',
    'Specification-Version'   : '1',
    'Implementation-Title'    : "${rootProject.artifact_base}-neoforge",
    'Implementation-Version'  : rootProject.mod_version,
    'Implementation-Vendor'   : 'bnfe12',
    'MixinConfigs'            : 'mixins.bedray_core.json,mixins.bedray_core_neoforge.json,mixins.bedray.json',
    'FMLModType'              : 'MOD'
]

jar {
    bundleCommon(it)
    manifest {
        attributes(modManifestAttributes)
    }
}

// Modular combined jar: the Bedray host with the Bedray Compute companion nested as a NeoForge JarJar
// (META-INF/jarjar/metadata.json). Compute keeps its own mod id (bedray_compute) and descriptor — it
// still loads as a separate mod, and extracting the nested jar into mods/ detaches it again. The
// standalone jar above stays exactly as before; the combined jar is an additional artifact.
evaluationDependsOn(':compute-neoforge')
def computeNeoJar = project(':compute-neoforge').tasks.named('jar')

// Writes the JarJar metadata FML reads: one candidate, the compute companion at its exact version.
// Field names and shape follow the metadata.json that NeoForge itself and mod builds (e.g. Sodium)
// ship: jars[].identifier {group, artifact}, jars[].version {range, artifactVersion}, path, isObfuscated.
def jarjarMetadata = tasks.register('generateJarJarMetadata') {
    def out = layout.buildDirectory.file('jarjar/metadata.json')
    inputs.property 'mod_group', rootProject.mod_group
    inputs.property 'mod_version', rootProject.mod_version
    inputs.property 'compute_artifact', 'bedray-compute-neoforge'
    outputs.file(out)
    doLast {
        def nestedName = computeNeoJar.get().archiveFileName.get()
        def metadata = [jars: [[
            identifier   : [group: String.valueOf(rootProject.mod_group), artifact: 'bedray-compute-neoforge'],
            version      : [range: "[${rootProject.mod_version},)", artifactVersion: String.valueOf(rootProject.mod_version)],
            path         : "META-INF/jarjar/${nestedName}",
            isObfuscated : false
        ]]]
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
}

tasks.register('combinedJar', Jar) {
    archiveClassifier = 'combined'
    group = 'build'
    description = 'Bedray host jar with the Bedray Compute companion nested as a JarJar mod (detachable: extract META-INF/jarjar/*.jar into mods/)'
    // A custom Jar task does not get the java plugin's default main output; the standalone jar does.
    from(sourceSets.main.output)
    bundleCommon(it)
    dependsOn computeNeoJar, jarjarMetadata
    from(computeNeoJar.map { it.archiveFile }) { into 'META-INF/jarjar' }
    from(jarjarMetadata.map { task -> task.outputs.files.singleFile }) { into 'META-INF/jarjar' }
    manifest {
        attributes(modManifestAttributes)
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = "${rootProject.artifact_base}-neoforge"
        }
    }
}
