apply from: rootProject.file('gradle/loader-module.gradle')

base { archivesName = 'bedray-renderer-api' }
java { withSourcesJar() }
dependencies {
    testImplementation "org.lwjgl:lwjgl:${rootProject.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-vulkan:${rootProject.lwjgl_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            artifactId = 'bedray-renderer-api'
        }
    }
}
